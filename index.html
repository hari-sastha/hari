<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Copy javascript.json</title>
</head>
<body>
	<h1>Copy Text</h1>

	<p>
		Click the button to copy the full content of <strong>javascript.json</strong> to your clipboard.
	</p>

	<button id="copyBtn" type="button">Copy Text</button>
	<button id="reloadBtn" type="button">Reload File</button>

	<p id="status">Loading...</p>

	<label for="preview">Preview (read-only):</label>
	<br />
	<textarea id="preview" rows="12" cols="80" readonly></textarea>

	<script src="index.js" defer></script>
</body>
</html>
